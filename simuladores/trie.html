<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Interativo - Trie (Árvore de Prefixos)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .pulse-glow { animation: pulse-glow 1.5s infinite; }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.8)); }
            50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 1)); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-600/20 text-emerald-400 rounded-xl border border-emerald-500/30">
                    <i class="fa-solid fa-tree text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-100 leading-tight">Simulador Trie</h1>
                    <p class="text-xs text-slate-400">Árvore de Prefixos por Caracteres (AEDS II)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700/60">
                    <i class="fa-solid fa-font text-emerald-400 mr-1"></i> Partilha de Prefixos
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
        
        <!-- Controles -->
        <section class="lg:col-span-4 flex flex-col gap-5">
            <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-xl space-y-4">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">1. Operações</h2>
                
                <div class="space-y-3">
                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                        <label class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-plus text-emerald-400"></i> Inserir Palavra:</label>
                        <div class="flex gap-2">
                            <input type="text" id="insert-val" onkeypress="if(event.key === 'Enter') startInsert()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-500" placeholder="Ex: casa">
                            <button onclick="startInsert()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium transition shadow">Inserir</button>
                        </div>
                    </div>

                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                        <label class="text-[11px] text-slate-400 font-semibold"><i class="fa-solid fa-magnifying-glass text-indigo-400"></i> Buscar Palavra:</label>
                        <div class="flex gap-2">
                            <input type="text" id="search-val" onkeypress="if(event.key === 'Enter') startSearch()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-indigo-300 focus:outline-none focus:border-indigo-500" placeholder="Ex: caso">
                            <button onclick="startSearch()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow">Buscar</button>
                        </div>
                    </div>

                    <button onclick="clearTree()" class="w-full py-2 mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium border border-slate-700/50 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Limpar Trie
                    </button>
                </div>
            </div>

            <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Legenda Visual</h3>
                <div class="space-y-2 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-slate-800 border border-indigo-500 inline-block"></span> <span class="text-slate-300">Nó Intermediário</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-600 border border-emerald-400 inline-block"></span> <span class="text-slate-300">Fim de Palavra (Marcado)</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Visualizador e Console -->
        <section class="lg:col-span-8 flex flex-col gap-5">
            <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-xl flex flex-col relative min-h-[420px]">
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-200">Árvore de Prefixos (Trie)</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <i class="fa-solid fa-gauge-high"></i> Velocidade:
                        <input type="range" id="animation-speed" min="100" max="1500" value="600" step="100" class="w-20 accent-emerald-500">
                    </div>
                </div>
                
                <div id="canvas-wrapper" class="w-full flex-1 relative flex items-center justify-center bg-slate-950 rounded-lg border border-slate-800/80 overflow-auto min-h-[360px]">
                    <svg id="tree-svg" class="block mx-auto min-w-[600px] min-h-[350px]"></svg>
                </div>
            </div>

            <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-xl flex-1 flex flex-col max-h-[220px]">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-emerald-400"></i> Rastro de Execução
                    </h3>
                    <button onclick="clearTraceLog()" class="text-[11px] text-slate-400 hover:text-slate-200">Limpar Log</button>
                </div>
                <div id="trace-log" class="flex-1 bg-slate-950 rounded-xl p-3 border border-slate-800/80 font-mono text-xs overflow-y-auto space-y-1.5">
                    <div class="text-slate-500 italic">Trie inicializada. Insira a primeira palavra.</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function logTrace(msg, type = 'info') {
            const logBox = document.getElementById('trace-log');
            if(!logBox) return;
            const entry = document.createElement('div');
            let color = 'text-slate-300';
            if (type === 'match') color = 'text-emerald-400 font-semibold';
            if (type === 'error') color = 'text-red-400';
            if (type === 'active') color = 'text-blue-400';
            if (type === 'warn') color = 'text-amber-400 font-semibold';
            entry.className = `${color} flex items-start gap-1.5 leading-relaxed`;
            entry.innerHTML = `<span class="text-slate-600 select-none">></span> <span>${msg}</span>`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearTraceLog() { document.getElementById('trace-log').innerHTML = ''; }
        function getSpeed() { return 1600 - parseInt(document.getElementById('animation-speed').value); }
        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, Math.max(0, ms))); }

        // --- ESTRUTURA TRIE ---
        class TrieNode {
            constructor(char = '') {
                this.id = Math.random().toString(36).substr(2, 9);
                this.char = char;
                this.children = {}; // Mapeia caracteres para nós filhos
                this.isEnd = false;
            }
        }

        let root = new TrieNode();
        let isAnimating = false;

        function clearTree() {
            if(isAnimating) return;
            root = new TrieNode();
            drawTreeVisual();
            clearTraceLog();
            logTrace("Trie limpa com sucesso.", "warn");
        }

        // --- RENDERIZAÇÃO SVG DINÂMICA ---
        let treeNodesMeta = {};

        function drawTreeVisual(highlightId = null) {
            const svg = document.getElementById('tree-svg');
            if(!svg) return;
            svg.innerHTML = '';
            treeNodesMeta = {};

            const wrapper = document.getElementById('canvas-wrapper');
            const baseW = Math.max(wrapper.clientWidth, 650);
            const baseH = Math.max(wrapper.clientHeight, 400);

            // Coleta nós por níveis para renderização hierárquica
            let levels = [];
            function assignLevels(node, depth) {
                if (!levels[depth]) levels[depth] = [];
                levels[depth].push(node);
                Object.values(node.children).forEach(child => assignLevels(child, depth + 1));
            }
            assignLevels(root, 0);

            let maxDepth = levels.length;
            let currentY = 40;
            let nodePositions = {};

            // Atribuição de coordenadas X e Y
            levels.forEach((lvlNodes, depth) => {
                let totalInLevel = lvlNodes.length;
                let spacing = Math.max(50, baseW / (totalInLevel + 1));
                
                lvlNodes.forEach((node, idx) => {
                    let x = spacing * (idx + 1);
                    let y = currentY;
                    nodePositions[node.id] = { node, x, y };
                });
                currentY += 75;
            });

            let finalWidth = Math.max(baseW, 650);
            let finalHeight = Math.max(baseH, currentY + 30);
            svg.style.width = `${finalWidth}px`;
            svg.style.height = `${finalHeight}px`;
            svg.setAttribute('viewBox', `0 0 ${finalWidth} ${finalHeight}`);

            // Desenhar Linhas (Arestas)
            function drawEdges(node) {
                let p1 = nodePositions[node.id];
                Object.values(node.children).forEach(child => {
                    let p2 = nodePositions[child.id];
                    if (p1 && p2) {
                        drawLine(svg, p1.x, p1.y, p2.x, p2.y, child.char);
                        drawEdges(child);
                    }
                });
            }
            drawEdges(root);

            // Desenhar Nós
            Object.values(nodePositions).forEach(meta => {
                const node = meta.node;
                const isRoot = (node === root);
                const isHighlight = (node.id === highlightId);

                let fill = node.isEnd ? '#059669' : '#0f172a';
                let stroke = node.isEnd ? '#34d399' : '#6366f1';

                if (isHighlight) {
                    fill = '#2563eb';
                    stroke = '#93c5fd';
                }

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', meta.x); circle.setAttribute('cy', meta.y);
                circle.setAttribute('r', isRoot ? '18' : '20');
                circle.setAttribute('fill', fill);
                circle.setAttribute('stroke', stroke);
                circle.setAttribute('stroke-width', '2.5');
                if (isHighlight) circle.classList.add('pulse-glow');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', meta.x); text.setAttribute('y', meta.y + 4);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#fff');
                text.setAttribute('font-size', '12');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('font-family', 'Fira Code');
                text.textContent = isRoot ? 'Ø' : node.char;

                group.appendChild(circle);
                group.appendChild(text);
                svg.appendChild(group);
            });
        }

        function drawLine(svg, x1, y1, x2, y2, label) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '2');
            svg.appendChild(line);

            // Rótulo da aresta (o caractere correspondente)
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', (x1 + x2) / 2 - 8);
            text.setAttribute('y', (y1 + y2) / 2);
            text.setAttribute('fill', '#38bdf8');
            text.setAttribute('font-size', '11');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('font-family', 'Fira Code');
            text.textContent = label;
            svg.appendChild(text);
        }

        // --- INSERÇÃO ANIMADA ---
        async function startInsert() {
            if (isAnimating) return;
            const input = document.getElementById('insert-val');
            let word = input.value.trim().toLowerCase();
            if (!word) return;

            isAnimating = true;
            input.value = '';
            logTrace(`A inserir a palavra "<strong>${word}</strong>"...`, 'active');

            let curr = root;
            drawTreeVisual(curr.id);
            await sleep(getSpeed());

            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                if (!curr.children[char]) {
                    curr.children[char] = new TrieNode(char);
                    logTrace(`Carácter '${char}' não existia. Criado novo ramo.`, 'warn');
                } else {
                    logTrace(`Carácter '${char}' já existe. A reusar prefixo.`, 'active');
                }
                curr = curr.children[char];
                drawTreeVisual(curr.id);
                await sleep(getSpeed());
            }

            curr.isEnd = true;
            drawTreeVisual(curr.id);
            logTrace(`Palavra "<strong>${word}</strong>" inserida com sucesso!`, 'match');
            
            await sleep(800);
            drawTreeVisual();
            isAnimating = false;
        }

        // --- BUSCA ANIMADA ---
        async function startSearch() {
            if (isAnimating) return;
            const input = document.getElementById('search-val');
            let word = input.value.trim().toLowerCase();
            if (!word) return;

            isAnimating = true;
            input.value = '';
            logTrace(`A buscar palavra "<strong>${word}</strong>"...`, 'active');

            let curr = root;
            drawTreeVisual(curr.id);
            await sleep(getSpeed());

            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                if (!curr.children[char]) {
                    logTrace(`Caminho interrompido. Carácter '${char}' não encontrado.`, 'error');
                    drawTreeVisual();
                    isAnimating = false;
                    return;
                }
                curr = curr.children[char];
                drawTreeVisual(curr.id);
                await sleep(getSpeed());
            }

            if (curr.isEnd) {
                logTrace(`Palavra "<strong>${word}</strong>" encontrada e validada!`, 'match');
            } else {
                logTrace(`O prefixo "<strong>${word}</strong>" existe, mas não marca o fim de uma palavra.`, 'warn');
            }

            await sleep(1000);
            drawTreeVisual();
            isAnimating = false;
        }

        window.onload = function() {
            drawTreeVisual();
        };
        window.addEventListener('resize', () => drawTreeVisual());
    </script>
</body>
</html>
