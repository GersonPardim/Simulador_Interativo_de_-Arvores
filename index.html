<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>Laboratório de Estruturas de Dados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { color-scheme: dark; --bg:#0b1120; --panel:#111b2e; --panel2:#162238; --line:#263650; --muted:#91a2bb; --text:#edf3fc; --accent:#60a5fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"DM Sans",sans-serif; }
    .app { min-height:100vh; display:grid; grid-template-columns:290px minmax(0,1fr); }
    aside { background:#0e1728; border-right:1px solid var(--line); padding:26px 18px; display:flex; flex-direction:column; gap:25px; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 8px; }
    .brand-mark { width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#38bdf8);font-size:19px;box-shadow:0 8px 24px #2563eb33; }
    .brand h1 { font:700 16px "Space Grotesk",sans-serif; margin:0; letter-spacing:-.3px; }
    .brand p { margin:3px 0 0;color:var(--muted);font-size:11px; }
    .section-label { padding:0 10px; color:#71839d; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
    nav { display:grid; gap:6px; }
    .nav-item { border:1px solid transparent; background:transparent; color:#aebbd0; border-radius:11px; padding:12px 11px; width:100%; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer; font:500 13px "DM Sans",sans-serif; transition:.18s; }
    .nav-item i { width:18px; text-align:center; color:#8094b1; font-size:14px; }
    .nav-item:hover { background:#17253b; color:#fff; }
    .nav-item.active { background:#1b3353; color:#fff; border-color:#2c5688; box-shadow:inset 3px 0 #60a5fa; }
    .nav-item.active i { color:#7fc0ff; }
    .side-note { margin-top:auto; border:1px solid var(--line); background:#111d30; border-radius:12px; padding:13px; color:var(--muted); font-size:11px; line-height:1.55; }
    .side-note i { color:#60a5fa; margin-right:5px; }
    main { min-width:0; display:flex; flex-direction:column; height:100vh; }
    .topbar { min-height:82px; border-bottom:1px solid var(--line); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; background:#0d1627; }
    .eyebrow { color:#7e93b2; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:5px; }
    .current-title { font:600 20px "Space Grotesk",sans-serif; margin:0; letter-spacing:-.5px; }
    .current-desc { color:var(--muted); font-size:12px; margin:4px 0 0; }
    .status { border:1px solid #24523f; color:#8ce0b4; background:#10291f; border-radius:999px; padding:7px 11px; white-space:nowrap; font-size:11px; }
    .status i { font-size:8px; margin-right:6px; }
    .mobile-select { display:none; }
    .viewer-wrap { flex:1; min-height:0; padding:16px; background:radial-gradient(ellipse at top right,#14243a 0,transparent 45%); }
    .viewer { width:100%; height:100%; border:1px solid #263650; border-radius:14px; overflow:hidden; background:#020617; box-shadow:0 16px 50px #0003; }
    iframe { width:100%; height:100%; border:0; display:block; background:#020617; }
    @media(max-width:760px) {
      .app { display:flex; flex-direction:column; min-height:100vh; }
      aside { padding:13px 15px 11px; gap:12px; border-right:0; border-bottom:1px solid var(--line); }
      .brand { padding:0 2px; }
      .brand-mark { width:36px;height:36px; }
      .brand h1 { font-size:14px; }
      .section-label,.side-note { display:none; }
      nav { display:flex; overflow-x:auto; gap:7px; padding-bottom:2px; scrollbar-width:thin; }
      .nav-item { width:auto; flex:0 0 auto; padding:9px 11px; font-size:11px; white-space:nowrap; }
      .nav-item i { width:auto; }
      main { height:calc(100vh - 133px); min-height:480px; }
      .topbar { min-height:75px; padding:12px 17px; }
      .current-title { font-size:17px; }
      .current-desc { font-size:11px; }
      .status { font-size:0; padding:7px 9px; }
      .status i { font-size:9px; margin:0; }
      .viewer-wrap { padding:9px; }
      .viewer { border-radius:10px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-diagram-project"></i></div>
      <div><h1>Laboratório de ED</h1><p>Simuladores interativos</p></div>
    </div>
    <div class="section-label">Escolha uma estrutura</div>
    <nav id="menu" aria-label="Menu de simuladores"></nav>
    <div class="side-note"><i class="fa-regular fa-lightbulb"></i> Selecione uma estrutura para abrir seu simulador. Cada ferramenta mantém sua interface e funcionalidades originais.</div>
  </aside>
  <main>
    <header class="topbar">
      <div>
        <div class="eyebrow">Visualizador de estruturas de dados</div>
        <h2 class="current-title" id="pageTitle">Octree 3D</h2>
        <p class="current-desc" id="pageDesc">Estrutura espacial tridimensional</p>
      </div>
      <div class="status"><i class="fa-solid fa-circle"></i> Simulador carregado</div>
    </header>
    <section class="viewer-wrap">
      <div class="viewer"><iframe id="simulator" title="Simulador selecionado" src="simuladores/octree.html"></iframe></div>
    </section>
  </main>
</div>
<script>
  const simulators = [
    { file:"octree.html", name:"Octree 3D", desc:"Estrutura espacial tridimensional", icon:"fa-cubes" },
    { file:"patricia.html", name:"PATRICIA Trie", desc:"Trie compactada para busca por prefixos", icon:"fa-code-branch" },
    { file:"quadtree.html", name:"QuadTree 2D", desc:"Organização espacial em duas dimensões", icon:"fa-border-all" },
    { file:"radix.html", name:"Radix Tree", desc:"Árvore de prefixos compactada", icon:"fa-diagram-project" },
    { file:"rubro-negro.html", name:"Árvore Rubro-Negra", desc:"Árvore de busca balanceada", icon:"fa-tree" },
    { file:"segment-tree.html", name:"Segment Tree", desc:"Consultas e atualizações em intervalos", icon:"fa-chart-bar" },
    { file:"trie.html", name:"Trie", desc:"Árvore de busca por prefixos", icon:"fa-sitemap" }
  ];
  const menu = document.getElementById("menu");
  const frame = document.getElementById("simulator");
  function selectSimulator(index) {
    const item = simulators[index];
    frame.src = "simuladores/" + item.file;
    document.getElementById("pageTitle").textContent = item.name;
    document.getElementById("pageDesc").textContent = item.desc;
    document.querySelectorAll(".nav-item").forEach((button, i) => {
      button.classList.toggle("active", i === index);
      button.setAttribute("aria-current", i === index ? "page" : "false");
    });
  }
  simulators.forEach((item, index) => {
    const button = document.createElement("button");
    button.className = "nav-item" + (index === 0 ? " active" : "");
    button.type = "button";
    button.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.name}</span>`;
    button.addEventListener("click", () => selectSimulator(index));
    menu.appendChild(button);
  });
</script>
</body>
</html>
